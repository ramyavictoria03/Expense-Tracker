<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger - Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Inter,sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:420px;
            background:#fff;
            padding:40px;
            border-radius:20px;
            box-shadow:0 20px 40px rgba(0,0,0,.2);
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:25px;
        }

        .field{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
        }

        input{
            width:100%;
            padding:13px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:14px;
            background:#4f46e5;
            color:#fff;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
            margin-top:10px;
        }

        button:hover{
            background:#4338ca;
        }

        .bottom{
            text-align:center;
            margin-top:20px;
        }

        a{
            color:#4f46e5;
            text-decoration:none;
            font-weight:600;
        }
    </style>

</head>
<body>

<div class="card">

    <h1>Create Account 🚀</h1>

    <p>Sign up to start tracking your expenses.</p>

    <form id="signupForm">

        <div class="field">
            <label>Full Name</label>
            <input type="text" id="full_name" required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="bottom">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script src="signup.js"></script>

</body>
</html>
